# Configuracoes de CORS
cors.originPatterns: http://localhost:8080,http://localhost:3000,http://localhost:5173

# Configuracoes do Spring Security
security.jwt.token.secret-key: ${SECRET_KEY}
security.jwt.token.expire-length: 1800000

# Nome da aplicacao
spring.application.name=backend

# Configuracoes do MySQL
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuracoes da JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

#logging.level.root: DEBUG