# Configurações de CORS
cors.originPatterns: http://localhost:8080,http://localhost:3000,http://localhost:5173

# Configuração do temporizador
simulation.scheduler.fixed-rate-ms=1000

# Nome da aplicação
spring.application.name=flightradar

# Configurações do MySQL
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/flight_radar_api?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

# Configurações da JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false