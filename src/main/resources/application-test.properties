spring.application.name=flightradar

# DATASOURCE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# H2 CLIENT
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA, SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Configuração do Flyway e JPA (A SOLUÇÃO) ---

# 1. (MAIS IMPORTANTE) Desabilita o gerenciamento de schema do Hibernate.
#    Isso diz ao Hibernate: "Não crie, altere ou valide nenhuma tabela. Apenas use o que já existe".
spring.jpa.hibernate.ddl-auto=update

# 2. Garante que o Flyway (e outros inicializadores) rode ANTES do JPA/Hibernate ser configurado.
#    Isso reforça a ordem correta de inicialização.
spring.jpa.defer-datasource-initialization=true

# 3. Garante que o Flyway está habilitado (geralmente é o padrão).
spring.flyway.enabled=false